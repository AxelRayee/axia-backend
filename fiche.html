<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>AxIA — Fiche bien</title>
<link rel="stylesheet" href="style.css">
<script src="common.js"></script>
</head>
<body>

<div id="app-nav"></div>

<main class="container">
  <div id="fiche-header"></div>
  <p class="page-status" id="pageStatus" role="status" aria-live="polite">Chargement…</p>

  <div class="fiche-grid" id="ficheBody" hidden>
    <div class="fiche-main" id="groups"></div>
    <div class="fiche-side" id="side"></div>
  </div>
</main>

<footer class="app-footer">Les champs soulignés en pointillé sont modifiables : chaque changement recalcule la rentabilité, le cash-flow et le score. Apport : videz le champ pour revenir au pourcentage par défaut (Réglages).</footer>

<script>
const { icon, esc, currency, signed, pct, marketBlock } = AxIA;
const listingId = new URLSearchParams(location.search).get('id');
let entry = null;

const SRC_LABEL = { ann: 'Annonce', est: 'Estimé', you: 'Saisi', miss: 'À compléter', chif: 'Chiffrage', vil: 'Tarif ville', auto: 'Auto' };
function srcFromTracked(s){
  return { annonce: 'ann', estimation: 'est', manquant: 'miss', manuel: 'you', chiffrage: 'chif' }[s] || '';
}
function badge(kind, extra){
  if(!kind) return '';
  const cls = { chif: 'you', vil: 'ann', auto: 'est' }[kind] || kind;
  return `<span class="src ${cls}">${SRC_LABEL[kind]}${extra ? ' · ' + extra : ''}</span>`;
}

// Ligne modifiable : group = 'project' | 'listing'
function inputRow(label, group, field, value, opts){
  opts = opts || {};
  const missing = opts.src === 'miss';
  return `<div class="frow">
    <div class="frow-label"><label for="f_${field}">${label}</label>${badge(opts.src, opts.srcExtra)}</div>
    <input id="f_${field}" type="number" class="frow-input${missing ? ' missing' : ''}" value="${value ?? ''}" step="${opts.step || 1}" placeholder="${opts.placeholder ?? '—'}"${opts.title ? ` title="${esc(opts.title)}"` : ''}
      onchange="saveField('${group}','${field}',this.value)">
    <span class="frow-unit">${opts.unit || '€'}</span>
  </div>`;
}
// Ligne calculée (non modifiable)
function calcRow(label, value, opts){
  opts = opts || {};
  return `<div class="frow${opts.total ? ' total' : ''}">
    <div class="frow-label"><span>${label}</span></div>
    <span class="frow-value ${opts.cls || ''}">${value}</span>
    <span class="frow-unit">${opts.unit || ''}</span>
  </div>`;
}
function group(title, rows, extraTitle){
  return `<section class="group-card"><h2 class="group-title"><span>${title}</span>${extraTitle || ''}</h2>${rows}</section>`;
}

function render(){
  const l = entry.listing, p = entry.project, f = entry.financials, src = p.sources || {};
  AxIA.renderFicheHeader(entry, 'analyse');

  const notaireDefault = l.prix ? Math.round(l.prix * 0.075) : null;
  const notaireSrc = p.fraisNotaire === notaireDefault ? 'est' : 'you';
  const loyerSrc = p.rentEstimated ? 'est' : 'you';
  const travauxSrc = src.travaux === 'chiffrage' ? 'chif' : (p.travaux ? 'you' : '');

  document.getElementById('groups').innerHTML =
    group('Achat',
      inputRow('Prix FAI', 'listing', 'prix', l.prix, { src: 'ann', step: 1000 }) +
      inputRow('Frais de notaire', 'project', 'fraisNotaire', p.fraisNotaire, { src: notaireSrc, srcExtra: notaireSrc === 'est' ? '7,5 %' : '', step: 500 }) +
      inputRow('Travaux', 'project', 'travaux', p.travaux, { src: travauxSrc, step: 500 }) +
      calcRow('Total projet', currency(f.totalProjet), { total: true })
    ) +
    group('Loyer', loyerRows(l, p, f, loyerSrc)) +
    group('Charges',
      inputRow('Taxe foncière', 'project', 'taxeFonciereAnnuelle', p.taxeFonciereAnnuelle, { src: srcFromTracked(src.taxeFonciereAnnuelle), unit: '€/an', step: 50 }) +
      inputRow('Charges de copropriété', 'project', 'chargesCoproMensuelles', p.chargesCoproMensuelles, { src: srcFromTracked(src.chargesCoproMensuelles), unit: '€/mois' }) +
      inputRow('Assurance PNO', 'project', 'assurancePNO', p.assurancePNO, { src: srcFromTracked(src.assurancePNO), unit: '€/mois' }) +
      inputRow('Gestion / comptabilité', 'project', 'gestionMensuelle', p.gestionMensuelle, { unit: '€/mois' }) +
      calcRow('Total charges', currency(f.chargesTotalMensuel), { total: true, unit: '/mois' })
    ) +
    group('Financement · 25 ans',
      (f.apportAuto
        ? inputRow('Apport', 'project', 'apport', '', { src: 'est', srcExtra: `${f.apportPct} % par défaut`, placeholder: Math.round(f.apport || 0), step: 1000, title: `Par défaut : ${f.apportPct} % du coût total. Saisissez un montant pour le fixer sur ce bien.` })
        : inputRow('Apport', 'project', 'apport', p.apport, { src: 'you', step: 1000, title: 'Videz le champ pour revenir au pourcentage par défaut.' })) +
      calcRow('Capital emprunté', currency(f.capitalEmprunte ?? f.totalProjet)) +
      inputRow('Taux du crédit', 'project', 'tauxCredit', p.tauxCredit, { unit: '%', step: 0.05 }) +
      calcRow('Mensualité', currency(f.creditMensuel), { unit: '/mois' }) +
      inputRow('Taux assurance emprunteur', 'project', 'tauxAssuranceEmprunteur', p.tauxAssuranceEmprunteur, { unit: '%', step: 0.01 }) +
      calcRow('Assurance emprunteur', currency(f.assuranceEmprunteurMensuelle), { unit: '/mois' }) +
      calcRow('Total crédit', currency((f.creditMensuel || 0) + (f.assuranceEmprunteurMensuelle || 0)), { total: true, unit: '/mois' })
    ) + commCard(l, p);

  // Colonne de droite
  const missing = [];
  if(src.taxeFonciereAnnuelle === 'manquant') missing.push('Taxe foncière');
  if(src.chargesCoproMensuelles === 'manquant') missing.push('Charges de copropriété');
  if(src.assurancePNO === 'manquant') missing.push('Assurance PNO');
  if(!l.dpe) missing.push('DPE');
  if(f.coloc){
    if(!f.coloc.chambres) missing.push('Nombre de chambres');
    if(f.coloc.chargesManquantes) missing.push('Charges incluses de la colocation');
  }
  const market = marketBlock(entry, { scale: true });

  document.getElementById('side').innerHTML = `
    <section class="group-card results">
      <h2 class="group-title"><span>Résultats</span></h2>
      <div class="kpi-label">Cash-flow mensuel${f.modeLocation === 'coloc' ? ' · colocation' : ''}</div>
      <div class="big-number ${f.cashFlowMensuel >= 0 ? 'pos' : 'neg'}">${signed(f.cashFlowMensuel)}</div>
      <div class="small-note">Loyer − charges − crédit − assurance emprunteur, avant impôt</div>
      <div class="duo">
        <div><div class="kpi-label">Rendement brut</div><div class="v">${pct(f.rentabiliteBrut, 2)}</div></div>
        <div><div class="kpi-label">Rendement net</div><div class="v">${pct(f.rentabiliteNette, 2)}</div></div>
      </div>
      <a class="btn btn-outline-gold" style="width:100%;margin-top:18px" href="fiscalite.html?id=${encodeURIComponent(entry.id)}">Voir après impôt</a>
    </section>
    ${market ? `<section class="group-card"><h2 class="group-title"><span>Marché du secteur</span></h2>${market}</section>` : ''}
    ${missing.length ? `<section class="group-card alert">
      <h2 class="group-title"><span>À compléter</span></h2>
      <p style="margin:0;font-size:14px;color:var(--ink-2);line-height:1.55">${missing.map(esc).join(', ')} : absent${missing.length > 1 ? 's' : ''} de l'annonce. Tant que ${missing.length > 1 ? 'ces champs restent vides' : 'ce champ reste vide'}, le cash-flow est probablement optimiste.</p>
    </section>` : ''}`;

  document.getElementById('ficheBody').hidden = false;
  document.getElementById('pageStatus').textContent = '';
}

// ---------- Loyer : location entière et/ou colocation ----------
function loyerRows(l, p, f, loyerSrc){
  const loc = p.location || {};
  const entierOn = loc.entier !== false, colocOn = !!loc.coloc, both = entierOn && colocOn;
  const c = f.coloc;
  let html = `<div class="frow mode-row">
    <div class="frow-label"><span>Location</span></div>
    <div class="mode-checks">
      <label class="check sm"><input type="checkbox" id="m_entier" ${entierOn ? 'checked' : ''} onchange="setMode('entier', this.checked)">Entier</label>
      <label class="check sm"><input type="checkbox" id="m_coloc" ${colocOn ? 'checked' : ''} onchange="setMode('coloc', this.checked)">Colocation</label>
    </div>
  </div>`;
  if(entierOn){
    html += inputRow(colocOn ? 'Loyer bien entier' : 'Loyer mensuel', 'project', 'monthlyRent', p.monthlyRent, { src: loyerSrc, srcExtra: p.rentEstimated && p.rentFiable === false ? 'peu fiable' : '', step: 10 });
  }
  if(colocOn && c){
    const chSrc = !c.chambresAuto ? 'you' : (c.chambres ? 'auto' : 'miss');
    const lcSrc = { manuel: 'you', ville: 'vil', estimation: 'est' }[c.source] || 'miss';
    const lcExtra = c.source === 'ville' ? (c.sourceDetail || '') : (c.source === 'estimation' ? 'peu fiable' : '');
    const lcTitle = c.source === 'estimation'
      ? `Aucun tarif de colocation enregistré pour ${l.ville || 'cette ville'} : loyer du bien entier + 20 %, divisé par le nombre de chambres. Ajoutez la ville dans Réglages ou saisissez un montant.`
      : (c.source === 'ville' ? `Tarif moyen d'une chambre à ${l.ville} (${c.sourceDetail || 'Réglages'}). Saisissez un montant pour ce bien si besoin.` : 'Videz le champ pour revenir au tarif de la ville.');
    html +=
      inputRow('Chambres', 'loc', 'chambres', loc.chambres ?? '', { src: chSrc, srcExtra: chSrc === 'auto' ? (l.chambres ? 'annonce' : 'pièces − 1') : '', placeholder: c.chambres ?? '—', unit: 'ch.', step: 1, title: 'Videz le champ pour revenir au nombre déduit de l\'annonce.' }) +
      inputRow('Loyer par chambre', 'loc', 'loyerChambre', loc.loyerChambre ?? '', { src: lcSrc, srcExtra: lcExtra, placeholder: c.loyerChambre ?? '—', unit: '€/mois', step: 10, title: lcTitle }) +
      inputRow('Charges incluses (énergie, internet…)', 'loc', 'chargesColoc', loc.chargesColoc ?? '', { src: c.chargesManquantes ? 'miss' : 'you', unit: '€/mois', step: 10, title: 'Ce que vous payez pour les colocataires si le loyer est charges comprises. Saisissez 0 si elles sont refacturées.' }) +
      calcRow('Loyer colocation', currency(c.loyerMensuel), { unit: '/mois' });
  }
  if(both){
    const alt = f.alternative;
    html += `<div class="frow mode-row">
      <div class="frow-label"><span>Retenu pour le calcul</span></div>
      <div class="segmented sm" role="group" aria-label="Scénario retenu">
        <button type="button" aria-pressed="${f.modeLocation === 'entier'}" onclick="setRetenu('entier')">Entier</button>
        <button type="button" aria-pressed="${f.modeLocation === 'coloc'}" onclick="setRetenu('coloc')">Coloc</button>
      </div>
    </div>
    ${alt ? `<p class="alt-note">Si ${alt.mode === 'coloc' ? 'colocation' : 'location entière'} : cash-flow <strong class="${alt.cashFlowMensuel >= 0 ? 'pos' : 'neg'}">${signed(alt.cashFlowMensuel)}</strong>/mois · rendement net ${pct(alt.rentabiliteNette, 2)}</p>` : ''}`;
  }
  html += calcRow(both || colocOn ? `Loyer annuel retenu` : 'Loyer annuel', currency(f.loyerAnnuel), { total: true });
  return html;
}
function locationNow(){
  const loc = entry.project.location || {};
  return { entier: loc.entier !== false, coloc: !!loc.coloc, retenu: loc.retenu || 'entier', chambres: loc.chambres ?? null, loyerChambre: loc.loyerChambre ?? null, chargesColoc: loc.chargesColoc ?? null };
}
async function setMode(kind, on){
  const loc = { ...locationNow(), [kind]: on };
  if(!loc.entier && !loc.coloc) loc[kind === 'entier' ? 'coloc' : 'entier'] = true; // au moins un mode
  await patchAndRender({ project: { location: loc } }, 'Mode de location enregistré.');
}
async function setRetenu(mode){
  await patchAndRender({ project: { location: { ...locationNow(), retenu: mode } } }, 'Scénario retenu enregistré.');
}

// ---------- Communication ----------
const today = () => { const d = new Date(); return new Date(d - d.getTimezoneOffset() * 60000).toISOString().slice(0, 10); };
function commField(label, field, value, opts){
  opts = opts || {};
  const v = (value || '').toString();
  const href = v && opts.href ? opts.href(v) : '';
  return `<div class="comm-field">
    <label for="c_${field}">${label}</label>
    <input id="c_${field}" class="comm-input" type="${opts.type || 'text'}" value="${esc(v)}" placeholder="${opts.placeholder || 'Non indiqué'}" maxlength="200"
      autocomplete="off" onchange="saveText('${field}', this.value)">
    ${opts.action ? `<a class="comm-action" ${href ? `href="${esc(href)}"` : 'aria-disabled="true" tabindex="-1"'}>${icon(opts.icon)}${opts.action}</a>` : '<span></span>'}
  </div>`;
}
function commCard(l, p){
  const s = p.suivi || {};
  return `<section class="group-card comm-card">
    <h2 class="group-title"><span>Communication</span></h2>
    <div class="comm-grid">
      <div>
        ${commField('Agence', 'contact', l.contact, { placeholder: 'Agence ou particulier' })}
        ${commField('Agent', 'agent_nom', l.agent_nom, { placeholder: 'Prénom Nom' })}
        ${commField('Téléphone', 'telephone', l.telephone, { type: 'tel', action: 'Appeler', icon: 'phone', href: v => 'tel:' + v.replace(/[^\d+]/g, '') })}
        ${commField('E-mail', 'email', l.email, { type: 'email', action: 'Écrire', icon: 'mail', href: v => /^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(v) ? 'mailto:' + v : '' })}
        ${commField('Horaires agence', 'horaires', l.horaires, { placeholder: 'Ex. lun–sam 9h–12h / 14h–19h' })}
      </div>
      <div>
        <p class="comm-sub">Suivi</p>
        <div class="track-row" style="border-top:none">
          <label class="check"><input type="checkbox" id="s_contacte" ${s.contacte ? 'checked' : ''} onchange="toggleSuivi('contacte')">Contacté</label>
          <input type="date" id="s_contacteLe" aria-label="Date du contact" value="${esc(s.contacteLe || '')}" ${s.contacte ? '' : 'disabled'} onchange="saveSuivi()">
        </div>
        <div class="track-row">
          <label class="check"><input type="checkbox" id="s_visite" ${s.visite ? 'checked' : ''} onchange="toggleSuivi('visite')">Visité</label>
          <input type="date" id="s_visiteLe" aria-label="Date de la visite" value="${esc(s.visiteLe || '')}" ${s.visite ? '' : 'disabled'} onchange="saveSuivi()">
        </div>
        <label for="s_notes" class="comm-sub" style="display:block;margin-top:14px">Notes</label>
        <textarea id="s_notes" class="comm-notes" maxlength="2000" placeholder="Ce qu'a dit l'agent, prochain rappel, impressions de visite…" onchange="saveSuivi()">${esc(s.notes || '')}</textarea>
      </div>
    </div>
  </section>`;
}
function toggleSuivi(kind){
  const on = document.getElementById('s_' + kind).checked;
  const date = document.getElementById(`s_${kind}Le`);
  date.disabled = !on;
  if(on && !date.value) date.value = today();
  // Visité implique contacté
  if(kind === 'visite' && on && !document.getElementById('s_contacte').checked){
    document.getElementById('s_contacte').checked = true;
    const cd = document.getElementById('s_contacteLe'); cd.disabled = false; if(!cd.value) cd.value = date.value;
  }
  saveSuivi();
}
async function saveSuivi(){
  const g = id => document.getElementById(id);
  const suivi = {
    contacte: g('s_contacte').checked, contacteLe: g('s_contacte').checked ? (g('s_contacteLe').value || null) : null,
    visite: g('s_visite').checked, visiteLe: g('s_visite').checked ? (g('s_visiteLe').value || null) : null,
    notes: g('s_notes').value
  };
  await patchAndRender({ project: { suivi } }, 'Suivi enregistré.');
}
async function saveText(field, raw){
  await patchAndRender({ listing: { [field]: raw.trim() || null } }, 'Enregistré.');
}
async function patchAndRender(body, okMsg){
  const status = document.getElementById('pageStatus');
  const activeId = document.activeElement && document.activeElement.id;
  status.textContent = 'Enregistrement…';
  try {
    entry = await AxIA.patchListing(listingId, body);
    render();
    status.innerHTML = `<span class="pos">${okMsg}</span>`;
    setTimeout(() => { if(status.textContent === okMsg) status.textContent = ''; }, 2000);
    const el = activeId && document.getElementById(activeId);
    if(el) el.focus({ preventScroll: true });
  } catch(err) {
    status.innerHTML = `<span class="neg">Impossible d'enregistrer : ${esc(err.message)}</span>`;
  }
}

async function saveField(group, field, raw){
  const value = raw === '' ? null : (parseFloat(raw) || 0);
  const body = group === 'loc'
    ? { project: { location: { ...locationNow(), [field]: value } } }
    : { [group]: { [field]: value } };
  if(group === 'project' && field === 'monthlyRent') body.project.rentEstimated = false;
  const status = document.getElementById('pageStatus');
  // Mémorise le champ où se trouve l'utilisateur (ex. après Tab) pour l'y remettre après le recalcul
  const activeId = document.activeElement && document.activeElement.id;
  status.textContent = 'Recalcul…';
  try {
    entry = await AxIA.patchListing(listingId, body);
    render();
    const el = activeId && document.getElementById(activeId);
    if(el) el.focus({ preventScroll: true });
  } catch(err) {
    status.innerHTML = `<span class="neg">Impossible d'enregistrer : ${esc(err.message)}</span>`;
  }
}

async function init(){
  AxIA.renderNav('analyses');
  if(!listingId){ document.getElementById('pageStatus').innerHTML = 'Aucune annonce sélectionnée. <a href="index.html">Retour aux analyses</a>'; return; }
  try {
    entry = await AxIA.getListing(listingId);
    render();
  } catch(err) {
    document.getElementById('pageStatus').innerHTML = `${esc(err.message)}. <a href="index.html">Retour aux analyses</a>`;
  }
}
init();
</script>
</body>
</html>
